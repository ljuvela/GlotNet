# CPU-only variant for Linux (avoids downloading CUDA wheels).
# On macOS, use environment.yml: the default wheels are CPU/MPS already.
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cmake
  - ninja
  - scikit-build-core
  - eigen
  - pytest
  # pthreads OpenBLAS: the OpenMP variant loads a second libomp that clashes
  # with the one bundled in the torch wheels (OMP: Error #15)
  - libopenblas=*=*pthreads*
  - pysoundfile
  - tensorboard
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cpu
      - torch
      - torchaudio
