# Build wheels + sdist and publish to PyPI.
#
#   - Pull requests touching the build: build and test wheels only
#   - Manual run (Actions tab): build, optionally upload to TestPyPI
#   - Published GitHub release: build and upload to PyPI
#
# Uploads use PyPI trusted publishing (OIDC), no API tokens. Configure a
# trusted publisher on pypi.org / test.pypi.org for this repository with
# workflow "pypi-cibuildwheel.yml" and environment "pypi" / "testpypi".
#
# cibuildwheel settings live in pyproject.toml ([tool.cibuildwheel]).
name: Wheels

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "ext/**"
      - ".github/workflows/pypi-cibuildwheel.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to TestPyPI"
        type: boolean
        default: false
  release:
    types: [ published ]

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # native runners: Linux x86_64, Linux aarch64, macOS arm64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build sdist
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish_testpypi:
    name: Upload to TestPyPI
    needs: [ build_wheels, build_sdist ]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/glotnet
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Upload to PyPI
    needs: [ build_wheels, build_sdist ]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/glotnet
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
