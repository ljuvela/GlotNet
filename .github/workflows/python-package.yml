# Build the extension from source (editable install) and run the test suite
name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build and install
      env:
        # CPU-only torch on Linux (default PyPI wheels pull in CUDA)
        PIP_EXTRA_INDEX_URL: ${{ runner.os == 'Linux' && 'https://download.pytorch.org/whl/cpu' || '' }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -v -e ".[test]" flake8

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 glotnet test --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test with pytest
      run: pytest test

  # The C++ core library on its own: no Python, no torch
  core:
    name: C++ core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Configure
      run: cmake -S . -B build-core -DGLOTNET_BUILD_PYTHON=OFF -DGLOTNET_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build-core --parallel

    - name: Test
      run: ctest --test-dir build-core --output-on-failure
